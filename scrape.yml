name: Scrape Talabat Menus

on:
  workflow_dispatch:
    inputs:
      restaurants_json:
        description: 'JSON array of restaurant names generated by Claude'
        required: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install duckduckgo-search requests beautifulsoup4 pandas

      - name: Run Scraper
        run: python scraper.py '${{ github.event.inputs.restaurants_json }}'

      - name: Commit & Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add talabat_cafeterias.csv
          git commit -m "Add scraped cafeteria menu dataset" || exit 0
          git push
